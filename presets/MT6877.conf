# 天玑920 (mt6877) 频率档位表 · 单位 kHz
# 全部取自本机 scaling_available_frequencies 真实频点，不含任何估算值
#
#  LITTLE = cluster0 = policy0 = 6×Cortex-A55 (cpu0-5)  可选：500000 ~ 2000000
#     500000 650000 740000 900000 980000 1053000 1150000 1260000
#     1310000 1407000 1503000 1600000 1703000 1800000 1903000 2000000
#
#  BIG    = cluster1 = policy6 = 2×Cortex-A78 (cpu6-7)  可选：650000 ~ 2500000
#     650000 740000 910000 1040000 1140000 1300000 1430000 1540000
#     1660000 1800000 1900000 2000000 2150000 2275000 2400000 2500000
#
# 键格式：<模式>_<LITTLE|BIG>_<daily|game>
#   powersave 省电 / balance 均衡 / performance 性能 / fast 极速
# 值 0 或不合法 → 自动回退该簇硬件最大值

# ---- 省电：压掉顶部档位，日常流畅优先，续航优先 ----
POWERSAVE_LITTLE_DAILY=1150000
POWERSAVE_LITTLE_GAME=1310000
POWERSAVE_BIG_DAILY=1540000
POWERSAVE_BIG_GAME=1800000

# ---- 均衡：日常默认，温控友好 ----
BALANCE_LITTLE_DAILY=1407000
BALANCE_LITTLE_GAME=1600000
BALANCE_BIG_DAILY=1800000
BALANCE_BIG_GAME=2000000

# ---- 性能：游戏主力档 ----
PERFORMANCE_LITTLE_DAILY=1600000
PERFORMANCE_LITTLE_GAME=1800000
PERFORMANCE_BIG_DAILY=2000000
PERFORMANCE_BIG_GAME=2275000

# ---- 极速：游戏默认，贴近硬件上限 ----
FAST_LITTLE_DAILY=1800000
FAST_LITTLE_GAME=2000000
FAST_BIG_DAILY=2275000
FAST_BIG_GAME=2500000
