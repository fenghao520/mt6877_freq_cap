# 实验功能 · 全部拉满（仅供跑分使用）
#
# enable  1=开启，0=关闭（默认关闭）
#         由 WebUI 首页的「实验功能」开关写入；开启后立刻全局生效，
#         覆盖日用/游戏模式，关闭立即恢复。
#
# 开启后做三件事：
#   ① CPU 两簇上限 → 硬件最大，并尝试把下限也贴上去
#   ② GPU  → 锁定到 OPP 表最高档
#   ③ DDR  → 锁定到最高档
#
# ⚠️ 仅供跑分使用
#   · 功耗与发热显著上升，长时间使用建议配外部散热器；玩游戏前请先关闭
#   · 所有节点都是内核运行时状态，**重启一定清零**
#   · 本机不支持的项会在 WebUI 上如实标注「本机无」，不会假装成功

enable=0
