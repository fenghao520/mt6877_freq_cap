# 刷新率管理 · 由 WebUI「刷新率」页写入
#
# enable  1=开启，0=关闭（默认关闭）
# daily   日用场景锁定的刷新率（Hz）
# game    游戏场景锁定的刷新率（Hz）
#
# 取值必须在本机支持的档位内 —— 本机（Redmi Note 11 Pro+）支持 60 / 120。
# 写一个不支持的档位不会报错，而是会被系统忽略（表现为「点了没反应」）。
#
# 行为：
#   · 只在亮屏时锁定；熄屏会自动交还系统，亮屏再锁回来
#   · 关闭本功能 / 停用模块 / 卸载模块 → 还原成你原来的设置
#   · 用的是 AOSP 标准设置项 min_refresh_rate / peak_refresh_rate，
#     和系统设置里的「刷新率」是同一套东西，不会互相打架

enable=0
daily=60
game=120
