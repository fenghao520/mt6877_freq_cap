# 全局自定义频率，单位 kHz。ENABLE=1 时生效（优先级高于档位覆盖与内置预设）
# 键名固定为 <LITTLE|BIG>_<DAILY|GAME>；开启后对日用/游戏两个场景全局生效，与所选档位无关。
# 想只微调某个档位（而不是全局覆盖），请用 WebUI「频率 → 档位表」写 tier_freq.conf。
# 只填某一项时，另一项回退档位表；填了非标准值也没关系，内核会自动向下对齐到最近档位。
#
#  A55 小核(cluster0) 真实频点：500000 650000 740000 900000 980000 1053000 1150000 1260000
#                              1310000 1407000 1503000 1600000 1703000 1800000 1903000 2000000
#  A78 大核(cluster1) 真实频点：650000 740000 910000 1040000 1140000 1300000 1430000 1540000
#                              1660000 1800000 1900000 2000000 2150000 2275000 2400000 2500000
#
# ⚠️ 语义（务必看清）：
#   0 / -1 / 负数  → 该簇「不限频」（本通道写 0 会被内核当成最低档 650MHz，模块已代你转成 -1）
#   非数字（如 abc）→ 视为「没配这一项」，回退档位表（不会静默放开限制）
#   留空          → 同上，视为没配

ENABLE=0

LITTLE_DAILY=1407000
LITTLE_GAME=1600000
BIG_DAILY=1800000
BIG_GAME=2000000
