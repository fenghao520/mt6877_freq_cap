# ============================================================
#  深度睡眠 · 配置文件（由 WebUI「深睡」页写入）
#  ------------------------------------------------------------
#  enable    1 = 开启；0 = 关闭
#  whitelist 白名单，逗号分隔的包名。深睡期间这些应用照常工作，
#            其余应用会被移出系统 Doze 白名单、强制进入休眠。
#            名单里未安装的包会被自动忽略，所以可以放心留着。
#  grace     熄屏宽限（秒）：熄屏后多久进入深睡，默认 20
#
#  说明：只「收窄」用户级白名单，系统自带的来电 / 短信 / 闹钟 /
#        IMS 等条目一律不动，所以通话与闹钟不受影响。
#        充电中、正在放音时不会进入深睡；亮屏或充电立即还原。
# ============================================================
enable=0
whitelist=com.tencent.mm,com.tencent.mobileqq
grace=20
